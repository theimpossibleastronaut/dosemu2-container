name: Build & push :release (dosemu2 from PPA)

# Builds the latest *released* dosemu2 from the upstream Ubuntu PPA.
# Independent of the Arch chain — Ubuntu base, apt-installs dosemu2 +
# comcom32 from the PPA. Multi-stage to drop the PPA bootstrap tools.

on:
  push:
    branches: [trunk]
    paths:
      - 'Dockerfile.release'
      - '.github/workflows/build-release.yml'
  workflow_dispatch:
  schedule:
    # Weekly. PPA refreshes are infrequent but cheap to rebuild
    # against (~2 min), so a low-cost weekly cron keeps :release
    # tracking whatever the PPA currently ships.
    - cron: '15 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push :release
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.release
          push: true
          tags: ${{ env.IMAGE }}:release
          cache-from: type=registry,ref=${{ env.IMAGE }}:release
          cache-to: type=inline
