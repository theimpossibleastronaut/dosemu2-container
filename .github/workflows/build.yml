name: Build & push the git chain

# Builds the Alpine chain and pushes every phase to GHCR:
#   :01-base → :02-binutils → :03-toolchain (== :build-env) →
#   :latest / :latest-headless
#
# Each phase is a separate job that `needs:` the previous one, so a
# later job only starts after the earlier image has actually been
# pushed to GHCR (and is therefore pullable as the next phase's
# BASE). Failed phases can be re-run individually from the Actions UI.
#
# The PPA-based :release image is built independently — see
# build-release.yml.

on:
  push:
    branches: [trunk]
    paths:
      - 'Dockerfile.01-base'
      - 'Dockerfile.02-binutils'
      - 'Dockerfile.03-toolchain'
      - 'Dockerfile.04-build'
      - 'entrypoint.sh'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: 'dosemu2 git ref to build for :latest (branch, tag, or SHA)'
        required: false
        default: 'devel'
  schedule:
    # Weekly refresh: picks up new Alpine base packages and rebuilds
    # :latest from the dosemu2 devel branch.
    - cron: '30 5 * * 0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}
  DH_IMAGE: docker.io/andy5995/dosemu2

jobs:
  build-01-base:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push :01-base
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.01-base
          push: true
          tags: ${{ env.IMAGE }}:01-base
          cache-from: type=registry,ref=${{ env.IMAGE }}:01-base
          cache-to: type=inline

  build-02-binutils:
    runs-on: ubuntu-24.04
    needs: build-01-base
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push :02-binutils
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.02-binutils
          push: true
          build-args: BASE=${{ env.IMAGE }}:01-base
          tags: ${{ env.IMAGE }}:02-binutils
          cache-from: type=registry,ref=${{ env.IMAGE }}:02-binutils
          cache-to: type=inline

  build-03-toolchain:
    runs-on: ubuntu-24.04
    needs: build-02-binutils
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_PAT_TOKEN }}
      # Build and load locally first so the entrypoint test runs
      # against the real image before it's published. Pushed only
      # after the test passes (next two steps).
      - name: Build :03-toolchain (also tagged :build-env)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.03-toolchain
          load: true
          build-args: BASE=${{ env.IMAGE }}:02-binutils
          # :build-env is the user-facing alias for the build
          # environment. Same digest as :03-toolchain, which stays as
          # the internal chain checkpoint name. Only :build-env is
          # mirrored to Docker Hub; :03-toolchain is GHCR-only (chain
          # BASE, never pulled from Docker Hub).
          tags: |
            ${{ env.IMAGE }}:03-toolchain
            ${{ env.IMAGE }}:build-env
            ${{ env.DH_IMAGE }}:build-env
          cache-from: type=registry,ref=${{ env.IMAGE }}:03-toolchain

      - name: Test build-env entrypoint permissions
        run: IMAGE=${{ env.IMAGE }}:03-toolchain test/entrypoint-perms.sh

      - name: Push :03-toolchain and :build-env
        run: |
          docker push ${{ env.IMAGE }}:03-toolchain
          docker push ${{ env.IMAGE }}:build-env
          docker push ${{ env.DH_IMAGE }}:build-env

  build-latest:
    runs-on: ubuntu-24.04
    needs: build-03-toolchain
    env:
      DOSEMU2_REF: ${{ inputs.ref || 'devel' }}
    steps:
      - uses: actions/checkout@v7

      - name: Clone dosemu2 (${{ env.DOSEMU2_REF }})
        # No --depth=1: the dosemu2 build's getversion script needs git
        # history to embed the rich "2.0pre9-dev-DATE-N-gSHA" version
        # string. With a shallow clone, getversion falls back to the
        # VERSION file (just "2.0pre9").
        run: |
          git clone --branch "${DOSEMU2_REF}" \
            https://github.com/dosemu2/dosemu2.git dosemu2-src
          echo "Built from $(cd dosemu2-src && git rev-parse HEAD)"

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_PAT_TOKEN }}

      - name: Build & push :latest
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.04-build
          target: runtime
          push: true
          build-args: BASE=${{ env.IMAGE }}:03-toolchain
          build-contexts: |
            dosemu2=./dosemu2-src
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.DH_IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.IMAGE }}:latest
          cache-to: type=inline

      - name: Build & push :latest-headless
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.04-build
          target: runtime-headless
          push: true
          build-args: BASE=${{ env.IMAGE }}:03-toolchain
          build-contexts: |
            dosemu2=./dosemu2-src
          tags: |
            ${{ env.IMAGE }}:latest-headless
            ${{ env.DH_IMAGE }}:latest-headless
          cache-from: type=registry,ref=${{ env.IMAGE }}:latest-headless
          cache-to: type=inline
