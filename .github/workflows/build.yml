name: Build & push the git chain

# Builds the Arch chain and pushes every phase to GHCR:
#   :01-pacman → :04-aur (== :build-env) → :latest
#
# Phase 04 used to compile the AUR deps via paru — ~30 min on the
# runner for the djgpp-gcc cross-compiler alone. The aur-pkgs/
# directory in this repo now holds those packages prebuilt (Git LFS),
# so Phase 04 reduces to "COPY + pacman -U" and skips Phases 02
# (paru) and 03 (djgpp-djcrx-bootstrap) entirely. Their Dockerfiles
# are kept around as recipes for the rare case of rebuilding from
# scratch (e.g. when a new AUR pkg's dep tree forces a paru rerun);
# trigger them manually with `docker buildx build` locally.
#
# Each phase that does run is a separate job that `needs:` the
# previous one, so a later job only starts after the earlier image
# has actually been pushed to GHCR (and is therefore pullable as the
# next phase's BASE). Failed phases can be re-run individually from
# the Actions UI.
#
# The PPA-based :release image is built independently — see
# build-release.yml.

on:
  push:
    branches: [trunk]
    paths:
      - 'Dockerfile.01-pacman'
      - 'Dockerfile.04-aur'
      - 'Dockerfile.05-build'
      - 'aur-pkgs/**'
      - 'entrypoint.sh'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: 'dosemu2 git ref to build for :latest (branch, tag, or SHA)'
        required: false
        default: 'devel'
  schedule:
    # Weekly refresh: picks up new Arch base packages and rebuilds
    # :latest from the dosemu2 devel branch. Phase 04 is now just a
    # pacman -U of the prebuilt aur-pkgs/, so the cadence is a
    # freshness choice, not a cost constraint.
    - cron: '30 5 * * 0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}
  DH_IMAGE: docker.io/andy5995/dosemu2

jobs:
  build-01-pacman:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push :01-pacman
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.01-pacman
          push: true
          tags: ${{ env.IMAGE }}:01-pacman
          cache-from: type=registry,ref=${{ env.IMAGE }}:01-pacman
          cache-to: type=inline

  build-04-aur:
    runs-on: ubuntu-24.04
    needs: build-01-pacman
    steps:
      # lfs: true so the aur-pkgs/*.pkg.tar.zst files are fetched as
      # real binaries, not the LFS pointer text — Phase 04's COPY of
      # aur-pkgs/ would otherwise drop pointer files into the image.
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_PAT_TOKEN }}
      # Build and load locally first so the entrypoint test runs
      # against the real image before it's published. Pushed only after
      # the test passes (next two steps).
      - name: Build :04-aur (also tagged :build-env)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.04-aur
          load: true
          build-args: BASE=${{ env.IMAGE }}:01-pacman
          # :build-env is the user-facing alias for the build
          # environment (all deps installed, no dosemu2 binary).
          # Same digest as :04-aur, which stays as the internal
          # chain checkpoint name. Only :build-env is mirrored to
          # Docker Hub; :04-aur is GHCR-only (chain BASE, never
          # pulled from Docker Hub).
          tags: |
            ${{ env.IMAGE }}:04-aur
            ${{ env.IMAGE }}:build-env
            ${{ env.DH_IMAGE }}:build-env
          cache-from: type=registry,ref=${{ env.IMAGE }}:04-aur

      - name: Test build-env entrypoint permissions
        run: IMAGE=${{ env.IMAGE }}:04-aur test/entrypoint-perms.sh

      - name: Push :04-aur and :build-env
        run: |
          docker push ${{ env.IMAGE }}:04-aur
          docker push ${{ env.IMAGE }}:build-env
          docker push ${{ env.DH_IMAGE }}:build-env

  build-latest:
    runs-on: ubuntu-24.04
    needs: build-04-aur
    env:
      DOSEMU2_REF: ${{ inputs.ref || 'devel' }}
    steps:
      # lfs: true — Phase 05's runtime stage bind-mounts aur-pkgs/
      # from the build context (same as Phase 04), so the .zst files
      # need to be real bytes, not LFS pointers.
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Clone dosemu2 (${{ env.DOSEMU2_REF }})
        # No --depth=1: the dosemu2 build's getversion script needs git
        # history to embed the rich "2.0pre9-dev-DATE-N-gSHA" version
        # string. With a shallow clone, getversion falls back to the
        # VERSION file (just "2.0pre9").
        run: |
          git clone --branch "${DOSEMU2_REF}" \
            https://github.com/dosemu2/dosemu2.git dosemu2-src
          echo "Built from $(cd dosemu2-src && git rev-parse HEAD)"

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_PAT_TOKEN }}

      - name: Build & push :latest
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.05-build
          push: true
          build-args: BASE=${{ env.IMAGE }}:04-aur
          build-contexts: |
            dosemu2=./dosemu2-src
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.DH_IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.IMAGE }}:latest
          cache-to: type=inline
