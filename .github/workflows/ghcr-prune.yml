name: ghcr-cleaner

# Biweekly cleanup of orphaned untagged versions of
# ghcr.io/theimpossibleastronaut/dosemu2-container.
#
# IMPORTANT: untagged ≠ deletable. When buildx pushes a multi-arch
# image it creates an OCI image index (which gets the tag) plus one
# untagged platform manifest per arch plus an untagged attestation
# manifest. A naive "delete every untagged version" sweep deletes
# those referenced platform/attestation manifests, leaving the tag
# pointing at dangling digests and `docker pull` failing with
# "manifest unknown". This workflow previously hand-rolled the
# bookkeeping (and broke every tag in the repo once); we now defer
# to Chizkiyahu/delete-untagged-ghcr-action whose
# `except_untagged_multiplatform: true` flag does exactly the right
# thing.
#
# PAT_TOKEN: a personal access token with `delete:packages` scope.
# GITHUB_TOKEN alone has the right scope for org packages but the
# action's API calls hit the user-level packages endpoints for
# organization repos and need a PAT. Same secret name as the
# Dealer's Choice ghcr-cleaner workflow we cribbed this from.

on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 7,21 * *'  # biweekly, 7th and 21st of each month, 02:30 UTC
  push:
    branches: trunk
    paths:
    - '**/ghcr-prune.yml'

jobs:
  clean:
    runs-on: ubuntu-24.04
    name: Delete untagged images
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete all containers from package without tags
        uses: Chizkiyahu/delete-untagged-ghcr-action@v6
        with:
          token: ${{ secrets.PAT_TOKEN }}
          repository_owner: ${{ github.repository_owner }}
          repository: ${{ github.repository }}
          untagged_only: true
          owner_type: org
          except_untagged_multiplatform: true
